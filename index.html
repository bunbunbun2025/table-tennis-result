<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>リーグ戦順位計算</title>
<style>
body{font-family:system-ui,sans-serif;max-width:850px;margin:auto;padding:12px;background:#f4f6f8;color:#222}h1{font-size:1.4rem}.box{background:white;padding:14px;border-radius:12px;margin:12px 0}label{display:block;font-weight:bold;margin:8px 0 4px}select,button{font:inherit;padding:9px;border:1px solid #ccd;border-radius:8px}button{background:#1769aa;color:white;border:0}.row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.team{text-align:center;font-weight:bold}.score select{min-width:76px}table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid #ddd;text-align:center}th{background:#eef2f6}.help{font-size:.9rem;color:#566}.tie{padding:10px 0;border-bottom:1px solid #eee}
</style></head><body>
<h1>リーグ戦順位計算</h1>
<div class="box"><label>リーグ形式</label><select id="format"><option value="pre">予選リーグ（3ゲーム必ず実施）</option><option value="final">決勝リーグ（5ゲーム・3ゲーム先取）</option></select>
<label>ペア数</label><select id="n"></select> <button id="make">対戦表を作成</button>
<p id="help" class="help">予選は勝敗に関係なく3ゲーム。3－0／2－1／1－2／0－3</p>
<p class="help">勝ち2点・負け1点。形式やペア数を変えて対戦表を作り直すと、入力結果は消去されます。</p></div>
<div class="box"><h2>試合結果入力</h2><div id="matches"></div></div>
<div class="box"><h2>順位表</h2><div id="ranking" class="help">結果を入力してください。</div></div>
<div class="box"><h2>じゃんけんによる順位決定</h2><p class="help">同率が残った場合、じゃんけん後の順位順を選んでください。</p><div id="ties"></div></div>
<script>
const $=x=>document.getElementById(x), pair=i=>'ペア'+(i+1);let games=[],janken={};
for(let i=3;i<=16;i++){let o=document.createElement('option');o.value=i;o.textContent=i+'ペア';$('n').append(o)}
function opts(){return $('format').value==='pre'?['3-0','2-1','1-2','0-3']:['3-0','3-1','3-2','0-3','1-3','2-3']}
function make(){games=[];janken={};let n=+$('n').value;for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)games.push({a,b,v:''});draw();calc()}
function draw(){let root=$('matches');root.innerHTML='';games.forEach((g,k)=>{let r=document.createElement('div');r.className='row';let a=document.createElement('div');a.className='team';a.textContent=pair(g.a);let b=document.createElement('div');b.className='team';b.textContent=pair(g.b);let mid=document.createElement('div');mid.className='score';let s=document.createElement('select');let z=document.createElement('option');z.value='';z.textContent='未入力';s.append(z);opts().forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v.replace('-','－');s.append(o)});s.value=g.v;s.onchange=()=>{games[k].v=s.value;calc()};mid.append(s);r.append(a,mid,b);root.append(r)})}
function pct(w,l){return w+l?w/(w+l):0}
function buckets(ids,fn){let m=new Map();ids.forEach(i=>{let x=fn(i);if(!m.has(x))m.set(x,[]);m.get(x).push(i)});return [...m.entries()].sort((a,b)=>b[0]-a[0]).map(x=>x[1])}
function perm(a){return []}
function calc(){
 let n=+$('n').value,s=Array.from({length:n},()=>({p:0,w:0,l:0,gf:0,ga:0}));
 games.forEach(m=>{if(!m.v)return;let [x,y]=m.v.split('-').map(Number),a=s[m.a],b=s[m.b];a.gf+=x;a.ga+=y;b.gf+=y;b.ga+=x;if(x>y){a.p+=2;b.p++;a.w++;b.l++}else{b.p+=2;a.p++;b.w++;a.l++}});
 function direct(ids){let w={};ids.forEach(i=>w[i]=0);games.forEach(m=>{if(!m.v||!ids.includes(m.a)||!ids.includes(m.b))return;let [x,y]=m.v.split('-').map(Number);w[x>y?m.a:m.b]++});return w}
 let unresolved=[];
 function resolve(ids){
  if(ids.length===1)return [ids];
  if(ids.length===2){let m=games.find(m=>ids.includes(m.a)&&ids.includes(m.b));if(m&&m.v){let [x,y]=m.v.split('-').map(Number),win=x>y?m.a:m.b;return [[win],[ids.find(i=>i!==win)]]}unresolved.push(ids);return [ids]}
  let intra={};ids.forEach(i=>intra[i]={w:0,l:0});
  games.forEach(m=>{if(!m.v||!ids.includes(m.a)||!ids.includes(m.b))return;let [x,y]=m.v.split('-').map(Number);intra[m.a].w+=x;intra[m.a].l+=y;intra[m.b].w+=y;intra[m.b].l+=x});
  let out=[];buckets(ids,i=>pct(intra[i].w,intra[i].l)).forEach(g=>{if(g.length===1){out.push(g);return}buckets(g,i=>pct(s[i].gf,s[i].ga)).forEach(h=>{if(h.length===1){out.push(h);return}let wins=direct(h);buckets(h,i=>wins[i]).forEach(z=>{if(z.length>1)unresolved.push(z);out.push(z)})})});return out
 }
 let order=[];buckets([...Array(n).keys()],i=>s[i].p).forEach(g=>order.push(...resolve(g).flat()));
 unresolved.forEach(g=>{let key=g.slice().sort((a,b)=>a-b).join(','),p=janken[key];if(p&&p.length===g.length&&p.every(v=>v!==undefined)){let slots=[];order.forEach((v,i)=>{if(g.includes(v))slots.push(i)});slots.forEach((v,k)=>order[v]=p[k])}});
 let h='<table><tr><th>順位</th><th>ペア</th><th>勝ち点</th><th>勝敗</th><th>ゲーム率</th></tr>';order.forEach((i,k)=>{let q=s[i];h+=`<tr><td>${k+1}</td><td>${pair(i)}</td><td>${q.p}</td><td>${q.w}勝 ${q.l}敗</td><td>${(pct(q.gf,q.ga)*100).toFixed(1)}%</td></tr>`});$('ranking').innerHTML=h+'</table>';
 let t=$('ties');t.innerHTML='';if(!unresolved.length)t.textContent='じゃんけんが必要な同率はありません。';
 unresolved.forEach(g=>{
  let key=g.slice().sort((a,b)=>a-b).join(','),d=document.createElement('div');d.className='tie';
  let l=document.createElement('label');l.textContent='同率ペアの順位を選択（じゃんけん結果順）';d.append(l);
  let chosen=(janken[key]||[]).slice();
  g.forEach((_,rank)=>{
    let line=document.createElement('div');line.className='help';line.style.margin='6px 0';
    let caption=document.createElement('span');caption.textContent=(rank+1)+'位： ';
    let sel=document.createElement('select');let blank=document.createElement('option');blank.value='';blank.textContent='ペアを選択';sel.append(blank);
    g.forEach(i=>{let o=document.createElement('option');o.value=String(i);o.textContent=pair(i);sel.append(o)});
    sel.value=chosen[rank]!==undefined?String(chosen[rank]):'';
    sel.onchange=()=>{
      let next=chosen.slice(0,g.length);next[rank]=sel.value===''?undefined:Number(sel.value);
      let used=next.filter(v=>v!==undefined);
      if(new Set(used).size!==used.length){alert('同じペアを重複して選べません。');sel.value='';next[rank]=undefined;}
      janken[key]=next;chosen=next;
      calc();
    };
    line.append(caption,sel);d.append(line);
  });
  t.append(d);
})
}
$('make').onclick=make;$('format').onchange=()=>{$('help').textContent=$('format').value==='pre'?'予選は勝敗に関係なく3ゲーム。3－0／2－1／1－2／0－3':'決勝は5ゲーム・3ゲーム先取。3－0／3－1／3－2／0－3／1－3／2－3'};make();
</script></body></html>
